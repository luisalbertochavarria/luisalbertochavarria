<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Luis Chavarria - monograma LC">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="60%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0d1a2b"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="96" fill="url(#fondo)"/>

  <!-- retícula sutil, mismo lenguaje del encabezado -->
  <g stroke="#1e2d47" stroke-width="1" opacity="0.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- monograma LC, trazado geométrico -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- L -->
    <path d="M176 152 L176 322 L262 322" stroke="url(#letra)" stroke-width="46"/>
    <!-- C abierta hacia la derecha -->
    <path d="M392 168 A 88 88 0 1 0 392 312" stroke="url(#letra)" stroke-width="46"/>
  </g>

  <!-- barra de acento: una linea de recorrido que termina en un nodo, -->
  <!-- continuacion del encabezado y guino al dominio del transporte -->
  <rect x="176" y="372" width="150" height="12" rx="6" fill="url(#acento)"/>
  <circle cx="357" cy="378" r="16" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.55"/>
  <circle cx="357" cy="378" r="7" fill="#22d3ee"/>
</svg>
